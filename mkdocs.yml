site_name: comfy-forge documentation
site_description: Architecture docs and decision records for comfy-env, comfy-test, and cuda-wheels
site_url: https://pozzettiandrea.github.io/comfy-forge-docs/
repo_url: https://github.com/PozzettiAndrea/comfy-forge-docs
repo_name: PozzettiAndrea/comfy-forge-docs
dev_addr: 0.0.0.0:8001

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

extra_javascript:
  - javascripts/mermaid-zoom.js

extra_css:
  - stylesheets/mermaid-zoom.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The aim: aims.md
  - Roadmap: roadmap.md
  - comfy-env:
      - Architecture: comfy-env/index.md
      - Nodepack Author Reference:
          - Lifecycle hooks:
              - "install()": comfy-env/install.md
              - "setup_env()": comfy-env/setup-env.md
              - "register_nodes()": comfy-env/register-nodes.md
          - Config reference: comfy-env/config.md
          - Settings reference: comfy-env/settings.md
          - Accelerator declarations: comfy-env/accelerators.md
          - Custom wire types: comfy-env/serializers.md
      - Internals:
          - The two-system problem: comfy-env/two-system-problem.md
          - Module inventory: comfy-env/modules.md
      - Decision records:
          - Index: comfy-env/adr/index.md
          # Process model
          - "0001: Process isolation via persistent subprocess workers": comfy-env/adr/0001-process-isolation-via-persistent-subprocess-workers.md
          - "0006: Worker crosses the boundary as source text": comfy-env/adr/0006-worker-crosses-the-boundary-as-source-text.md
          - "0008: Graceful degradation everywhere": comfy-env/adr/0008-graceful-degradation-everywhere.md
          - "0009: Platform strategy": comfy-env/adr/0009-platform-strategy.md
          - "0011: Isolation before sandboxing": comfy-env/adr/0011-isolation-before-sandboxing.md
          # Installing things
          - "0002: pixi as environment manager": comfy-env/adr/0002-pixi-as-environment-manager.md
          - "0007: Machine-wide workspace, per-env manifests": comfy-env/adr/0007-machine-wide-workspace-with-per-env-manifests.md
          - "0004: Prebuilt CUDA wheel index": comfy-env/adr/0004-prebuilt-cuda-wheel-index.md
          - "0016: Node pack dependencies": comfy-env/adr/0016-node-pack-dependencies.md
          # Configuration
          - "0003: Two config files, two roles": comfy-env/adr/0003-two-config-files-with-two-roles.md
          - "0013: Env-file config: honest passthrough": comfy-env/adr/0013-env-file-passthrough-contract.md
          - "0012: Unavailable nodes hidden, not unregistered": comfy-env/adr/0012-unavailable-nodes-hidden-not-unregistered.md
          # Transport
          - "0005: Tiered tensor serialization": comfy-env/adr/0005-tiered-tensor-serialization.md
          - "0010: Wire protocol and transport": comfy-env/adr/0010-wire-protocol-and-transport.md
          - "0014: Pack-extensible serializer registry": comfy-env/adr/0014-pack-extensible-serializer-registry.md
          - "0015: Declared wire types": comfy-env/adr/0015-declared-wire-types.md
  - comfy-test:
      - Overview: comfy-test/index.md
  - cuda-wheels:
      - Overview: cuda-wheels/index.md
      - Decision records:
          - Index: cuda-wheels/adr/index.md
          - "0001: Declarative package configs": cuda-wheels/adr/0001-declarative-package-configs.md
          - "0002: Rolling releases as wheel storage": cuda-wheels/adr/0002-rolling-releases-as-wheel-storage.md
          - "0003: Static index from the Releases API": cuda-wheels/adr/0003-static-index-from-releases-api.md
          - "0004: Combo-encoded versions + METADATA patching": cuda-wheels/adr/0004-combo-encoded-versions-and-metadata-patching.md
          - "0005: Shared grid + arch-list policy": cuda-wheels/adr/0005-shared-grid-and-arch-list-policy.md
          - "0006: Fitting CUDA compiles into hosted CI": cuda-wheels/adr/0006-fitting-cuda-compiles-into-hosted-ci.md
          - "0007: Phantom combos denylist": cuda-wheels/adr/0007-phantom-combos-denylist.md
          - "0008: Upstream torch watcher (proposed)": cuda-wheels/adr/0008-upstream-torch-watcher.md
