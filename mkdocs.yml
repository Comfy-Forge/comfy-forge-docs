          - Module inventory: comfy-env/modules.md
      - Decision records:
          - Index: comfy-env/adr/index.md
          # Process model
          - "0001: Process isolation via persistent subprocess workers": comfy-env/adr/0001-process-isolation-via-persistent-subprocess-workers.md
          - "0006: comfy-env is never installed into worker envs": comfy-env/adr/0006-worker-crosses-the-boundary-as-source-text.md
          - "0018: Worker call timeout": comfy-env/adr/0018-worker-call-timeout.md
          - "0019: Worker lifecycle": comfy-env/adr/0019-worker-lifecycle.md
          - "0020: Concurrency and env granularity": comfy-env/adr/0020-concurrency-and-env-granularity.md
          - "0032: Shared-memory lifetime (consumed-ack)": comfy-env/adr/0032-shm-lifetime-consumed-ack.md
