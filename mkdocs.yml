site_name: comfy-forge documentation
site_description: Architecture docs and decision records for comfy-env, comfy-test, cuda-wheels and the Comfy-Forge registry
site_url: https://docs.comfy-forge.org/
repo_url: https://github.com/Comfy-Forge/comfy-forge-docs
repo_name: Comfy-Forge/comfy-forge-docs
edit_uri: edit/main/docs/
dev_addr: 0.0.0.0:8001

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

extra_javascript:
  - javascripts/mermaid-zoom.js

extra_css:
  - stylesheets/mermaid-zoom.css
  - stylesheets/forge-bar.css

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

