site_name: comfy-forge documentation
site_description: Architecture docs and decision records for comfy-env, comfy-test, and cuda-wheels
site_url: https://pozzettiandrea.github.io/comfy-forge-docs/
repo_url: https://github.com/PozzettiAndrea/comfy-forge-docs
repo_name: PozzettiAndrea/comfy-forge-docs
dev_addr: 0.0.0.0:8001

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

extra_javascript:
  - javascripts/mermaid-zoom.js

extra_css:
  - stylesheets/mermaid-zoom.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The aim: aims.md
  - Roadmap: roadmap.md
  - comfy-env:
      - Architecture: comfy-env/index.md
      - Nodepack Author Reference:
          - Lifecycle hooks:
              - "install()": comfy-env/install.md
              - "setup_env()": comfy-env/setup-env.md
              - "register_nodes()": comfy-env/register-nodes.md
          - Config reference: comfy-env/config.md
          - Settings reference: comfy-env/settings.md
          - Accelerator declarations: comfy-env/accelerators.md
          - Custom wire types: comfy-env/serializers.md
      - Internals:
